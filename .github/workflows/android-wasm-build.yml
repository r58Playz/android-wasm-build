name: IKVM WASM Build

env:
  EMSDK_VERSION: 3.1.56
  IKVM_REPO: https://github.com/r58playz/ikvm.git
  IKVM_REF: wasm
  IKVM_VERSION: 8.14.0
  BUILD_RUNTIME: linux-x64

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # The managed build and the wasm natives are one job: the natives compile against the JNI headers that the class
  # library's build (the JDK's own make) generates.
  build-ikvm:
    name: Build IKVM (managed + WASM native)
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.ikvmproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # IKVM's global.json pins the SDK feature band; the fork's base wants 10.0.x
          dotnet-version: 10.0.x

      # The class library is JDK 25's, built by the JDK's make, which needs a JDK 25 to boot from.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # mono and clang for IKVM; the rest is what the JDK's configure checks for on Linux.
      - name: Install Build Prereqs
        run: |
          sudo apt-get update && \
          sudo apt-get install -y mono-runtime mono-devel clang llvm autoconf make zip unzip file \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev libcups2-dev \
            libfontconfig1-dev libasound2-dev

      - name: Build IKVM via script
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/ikvm/build-ikvm-local.sh"

      - name: Upload MSBuild Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlogs
          path: tools/ikvm/ikvm/artifacts/jdk25/msbuild-*.binlog
          if-no-files-found: warn

      - name: Upload IKVM bundle
        uses: actions/upload-artifact@v4
        with:
          name: ikvm-wasm-bundle
          path: tools/ikvm/out/release/ikvm-wasm-bundle.zip
          if-no-files-found: error

  build-glfw:
    name: build glfw (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [mt, st]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # mesa-wink's --install-deps supports Homebrew and pacman; install Ubuntu's tools here.
      - name: Install mesa-wink build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl python3 python3-venv cmake ninja-build bison flex pkg-config

      # build-glfw.sh pins and builds MercuryWorkshop/mesa-wink. Cache its expensive dependencies per variant.
      - name: Cache mesa-wink build deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/mesa-wink
          key: mesa-wink-${{ matrix.variant }}-emsdk${{ env.EMSDK_VERSION }}-${{ hashFiles('tools/native-deps/build-glfw.sh') }}

      - name: build glfw
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/native-deps/build-glfw.sh" --variant="${{ matrix.variant }}"

      - name: Upload GLFW artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glfw-${{ matrix.variant }}
          # GLFW (built against wink's headers), mesa-wink's three archives, and wink's JS libraries
          # (numbered: the app link passes them in that order).
          path: |
            tools/native-deps/out/${{ matrix.variant }}/libglfw3.a
            tools/native-deps/out/${{ matrix.variant }}/libwink*.a
            tools/native-deps/out/${{ matrix.variant }}/lib_emscripten_glfw3.js
            tools/native-deps/out/${{ matrix.variant }}/wink-js/*.js
          if-no-files-found: error

  build-java-native-deps:
    name: build java/native deps (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [mt, st]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: build libffi
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/native-deps/build-libffi.sh" --variant="${{ matrix.variant }}"

      - name: build lwjgl3
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/native-deps/build-lwjgl3.sh" --variant="${{ matrix.variant }}"

      - name: Upload Java/native dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-native-deps-${{ matrix.variant }}
          path: tools/native-deps/out/${{ matrix.variant }}/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-ikvm, build-java-native-deps, build-glfw]
    permissions:
      contents: write
    steps:
      - name: Generate release id
        run: echo RELEASE_NAME=$(uuidgen) >> "$GITHUB_ENV"

      - name: Download IKVM bundle
        uses: actions/download-artifact@v4
        with:
          name: ikvm-wasm-bundle
          path: release/

      - name: Download Java/native dependency artifacts (mt)
        uses: actions/download-artifact@v4
        with:
          name: java-native-deps-mt
          path: java-native-deps/mt/

      - name: Download Java/native dependency artifacts (st)
        uses: actions/download-artifact@v4
        with:
          name: java-native-deps-st
          path: java-native-deps/st/

      - name: Download all GLFW artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: glfw-*
          path: glfw/

      - name: Bundle artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

           # GLFW + mesa-wink per variant: libglfw3.a, the three wink archives, GLFW's JS library, and
           # wink's ordered JS libraries as one zip the client unpacks into statics/wink-js/.
           for variant in mt st; do
             cp "glfw/glfw-${variant}/libglfw3.a" "release/libglfw3-${variant}.a"
             for a in libwink libwink_webgpu libwink_tint; do
               cp "glfw/glfw-${variant}/${a}.a" "release/${a}-${variant}.a"
             done
             cp "glfw/glfw-${variant}/lib_emscripten_glfw3.js" \
               "release/lib_emscripten_glfw3-${variant}.js"
             zip -q -j "release/wink-js-${variant}.zip" glfw/glfw-${variant}/wink-js/*.js
           done

          cp java-native-deps/mt/lwjgl3.jar release/lwjgl3-mt.jar
          cp java-native-deps/mt/liblwjgl3.a release/liblwjgl3-mt.a
          cp java-native-deps/mt/liblwjgl_stb.a release/liblwjgl_stb-mt.a
          cp java-native-deps/st/lwjgl3.jar release/lwjgl3-st.jar
          cp java-native-deps/st/liblwjgl3.a release/liblwjgl3-st.a
          cp java-native-deps/st/liblwjgl_stb.a release/liblwjgl_stb-st.a

          cp java-native-deps/mt/libffi.a release/libffi-mt.a
          cp java-native-deps/st/libffi.a release/libffi-st.a

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: "IKVM WASM ${{ env.RELEASE_NAME }}"
          body: "These are the IKVM libs built for WASM (Emscripten)"
          commit: ${{ github.ref_name }}
          tag: ${{ env.RELEASE_NAME }}
          removeArtifacts: true
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
