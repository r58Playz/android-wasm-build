name: Android WASM Build

env:
  EMSDK_VERSION: 3.1.56
  IKVM_REPO: https://github.com/r58playz/ikvm.git
  IKVM_REF: android
  IKVM_VERSION: 8.14.0
  BUILD_RUNTIME: linux-x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The managed build and the wasm natives are one job: the natives compile against the JNI headers that the class
  # library's build (the JDK's own make) generates.
  build-ikvm:
    name: Build IKVM (managed + WASM native)
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.ikvmproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # IKVM's global.json pins the SDK feature band; the fork's base wants 10.0.x
          dotnet-version: 10.0.x

      # The class library is JDK 25's, built by the JDK's make, which needs a JDK 25 to boot from.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # mono and clang for IKVM; the rest is what the JDK's configure checks for on Linux.
      - name: Install Build Prereqs
        run: |
          sudo apt-get update && \
          sudo apt-get install -y mono-runtime mono-devel clang llvm autoconf make zip unzip file \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev libcups2-dev \
            libfontconfig1-dev libasound2-dev

      - name: Build IKVM via script
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/ikvm/build-ikvm-local.sh"

      - name: Upload MSBuild Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlogs
          path: tools/ikvm/ikvm/artifacts/jdk25/msbuild-*.binlog
          if-no-files-found: warn

      - name: Upload IKVM bundle
        uses: actions/upload-artifact@v4
        with:
          name: ikvm-wasm-bundle
          path: tools/ikvm/out/release/ikvm-wasm-bundle.zip
          if-no-files-found: error

  # Mesa's OpenGL on WebGPU (tools/wink/build-wink.sh pins it). mt only: the runner is threaded.
  build-wink:
    name: Build mesa-wink (mt)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # mesa-wink's --install-deps supports Homebrew and pacman; install Ubuntu's tools here.
      - name: Install mesa-wink build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl python3 python3-venv cmake ninja-build bison flex zip

      # Wink's expensive dependencies (Dawn, Tint, its venv), keyed on the script that pins wink.
      - name: Cache mesa-wink build deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/mesa-wink
          key: mesa-wink-mt-emsdk${{ env.EMSDK_VERSION }}-${{ hashFiles('tools/wink/build-wink.sh') }}

      - name: Build mesa-wink
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/wink/build-wink.sh" --variant=mt

      - name: Upload wink
        uses: actions/upload-artifact@v4
        with:
          name: wink-mt
          path: tools/wink/out/wink-mt.zip
          if-no-files-found: error

  # The androidx Material 3 Catalog, an R8 release build (apps/catalog/build.sh pins its sources and snapshot).
  build-catalog:
    name: Build the Material 3 Catalog APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - name: Build the catalog
        shell: bash
        run: bash "$GITHUB_WORKSPACE/apps/catalog/build.sh"

      - name: Upload the catalog
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: apps/catalog/out/*
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-ikvm, build-wink, build-catalog]
    permissions:
      contents: write
    steps:
      - name: Generate release id
        run: echo RELEASE_NAME=$(uuidgen) >> "$GITHUB_ENV"

      - name: Download IKVM bundle
        uses: actions/download-artifact@v4
        with:
          name: ikvm-wasm-bundle
          path: release/

      - name: Download wink
        uses: actions/download-artifact@v4
        with:
          name: wink-mt
          path: release/

      - name: Download the catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: release/

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: "Android WASM ${{ env.RELEASE_NAME }}"
          body: "The Android runner's prebuilt inputs: the IKVM bundle, mesa-wink (mt), and the Material 3 Catalog APK"
          commit: ${{ github.ref_name }}
          tag: ${{ env.RELEASE_NAME }}
          removeArtifacts: true
          artifacts: "release/*"
          token: ${{ secrets.GITHUB_TOKEN }}
